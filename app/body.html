<div class="wrap" id="wrap">
  <header>
    <h1>Lab 4 Bench<small>CHEM 1170 · Week 11 · Wednesday</small></h1>
    <div class="tabs" role="tablist" aria-label="Lab parts">
      <button type="button" role="tab" id="t-orbitals" aria-controls="p1" aria-selected="true" data-tab="orbitals">Part 1 <span>NH<sub>3</sub> MOs</span></button>
      <button type="button" role="tab" id="t-unit-cells" aria-controls="p2" aria-selected="false" data-tab="unit-cells">Part 2 <span>BCC &amp; FCC</span></button>
    </div>
    <div class="tools">
      <button id="bStudent" type="button" aria-pressed="false">Student mode</button>
      <button id="bPresent" type="button" aria-pressed="false">Present</button>
    </div>
  </header>

  <!-- ===================================================== PART 1 -->
  <section class="pane" id="p1" role="tabpanel" aria-labelledby="t-orbitals">
    <div class="bar">
      <div class="steps" id="mStep" role="group" aria-label="Step">
        <button type="button" data-v="shape" aria-pressed="true"><b>1</b>Shape</button>
        <button type="button" data-v="frag" aria-pressed="false"><b>1.1</b>H<sub>3</sub> fragment</button>
        <button type="button" data-v="match" aria-pressed="false"><b>1.3</b>Match</button>
        <button type="button" data-v="mo" aria-pressed="false"><b>1.4</b>MO diagram</button>
      </div>
      <span class="sp"></span>
      <button id="mLabels" type="button" aria-pressed="true">Labels</button>
      <button id="mDown" type="button">Down C<sub>3</sub></button>
      <button id="mReset" type="button">Reset view</button>
    </div>
    <div class="app">
      <div class="stage" id="mStage">
        <div class="labels" id="mLabelsEl"></div>
        <div class="over"><div class="toast" id="mToast" hidden></div></div>
        <div class="dock"><div class="chips" id="mChips"></div><div class="chips" id="mChips2"></div></div>
      </div>
      <aside class="info" id="mInfo"></aside>
    </div>
  </section>

  <!-- ===================================================== PART 2 -->
  <section class="pane" id="p2" role="tabpanel" aria-labelledby="t-unit-cells" hidden>
    <div class="bar">
      <div class="seg" id="cStruct" role="group" aria-label="Structure">
        <button type="button" data-v="bcc" aria-pressed="true">BCC</button>
        <button type="button" data-v="fcc" aria-pressed="false">FCC</button>
      </div>
      <div class="seg" id="cStyle" role="group" aria-label="Model style">
        <button type="button" data-v="small" aria-pressed="true">Reduced spheres</button>
        <button type="button" data-v="hard" aria-pressed="false">Hard spheres</button>
        <button type="button" data-v="cut" aria-pressed="false">Cut at the cell</button>
      </div>
      <span class="sp"></span>
      <button id="cReset" type="button">Reset view</button>
    </div>
    <div class="app">
      <div class="stage" id="cStage">
        <div class="labels" id="cLabelsEl"></div>
        <div class="over"><div class="toast" id="cToast" hidden></div></div>
        <div class="dock"><div class="chips" id="cChips"></div></div>
      </div>
      <aside class="info" id="cInfo"></aside>
    </div>
  </section>
</div>
